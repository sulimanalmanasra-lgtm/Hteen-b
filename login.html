          <svg width="16" height="19" viewBox="0 0 16 19" fill="currentColor" aria-hidden="true"><path d="M13.3 10.1c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8C3.9 4.9 2.5 5.8 1.7 7.200c-1.6 2.8-.4 6.900 1.2 9.100.8 1.1 1.700 2.300 2.900 2.300 1.200 0 1.600-.7 3-.7s1.800.7 3 .7c1.200 0 2-1.100 2.800-2.200.9-1.3 1.200-2.500 1.300-2.600-.1 0-2.600-1-2.600-3.700zM11 3.300C11.6 2.500 12.1 1.5 11.9.4c-.9 0-2 .6-2.7 1.400-.6.700-1.100 1.700-1 2.700 1 .1 2.1-.5 2.800-1.200z"/></svg>
          المتابعة مع ابل
        </button>
      </div>
      <div class="or">أو بالإيميل</div>

        <label>كلمة السر<input id="pw" type="password" autocomplete="current-password" required minlength="10" dir="ltr"></label>

<script>
// ===== إعدادات تسجيل الدخول: بدّلها بقيمك =====
const API = "https://ضع-رابط-استضافة-PHP-هنا/api/auth.php";   // مثال: https://example.com/api/auth.php
const GOOGLE_CLIENT_ID = "ضع_GOOGLE_CLIENT_ID_هنا";
const APPLE_CLIENT_ID  = "ضع_APPLE_SERVICES_ID_هنا";
const APPLE_REDIRECT   = location.origin + location.pathname;
// ==============================================

let csrf = "", mode = "login";
const $id = id => document.getElementById(id);
const say = (t, ok) => { $id("msg").textContent = t; $id("msg").className = "msg" + (ok ? " ok" : ""); };
const placeholder = v => !v || v.startsWith("ضع");

async function call(action, data) {
  if (!csrf && action !== "csrf") csrf = (await call("csrf")).csrf;
  let r, j;
  try {
    r = await fetch(`${API}?action=${action}`, {
      method: data ? "POST" : "GET", credentials: "include",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrf },
      body: data ? JSON.stringify(data) : undefined
    });
    j = await r.json();
  } catch (e) { throw new Error("تعذّر الاتصال بالسيرفر. تأكد إن ملفات PHP مرفوعة على استضافة تشغّل PHP وإن رابط API صحيح."); }
  if (!r.ok) throw new Error(j.error || "صار خطأ، جرّب مرة ثانية.");
  if (j.csrf) csrf = j.csrf;
  return j;
}
function done(u) { $id("authView").hidden = true; $id("doneView").hidden = false; $id("hello").textContent = "مرحباً " + (u.name || u.email); }

function setMode(m) {
  mode = m;
  $id("tLogin").classList.toggle("on", m === "login"); $id("tLogin").setAttribute("aria-selected", m === "login");
  $id("tReg").classList.toggle("on", m === "register"); $id("tReg").setAttribute("aria-selected", m === "register");
  $id("nameRow").hidden = m === "login";
  $id("submit").textContent = m === "login" ? "دخول" : "إنشاء الحساب";
  $id("pw").autocomplete = m === "login" ? "current-password" : "new-password";
  say("");
}
$id("tLogin").onclick = () => setMode("login");
$id("tReg").onclick = () => setMode("register");

$id("f").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $id("email").value.trim(), password = $id("pw").value;
  if (!email || !password) return say("عبّي الإيميل وكلمة السر.");
  if (mode === "register" && password.length < 10) return say("كلمة السر لازم تكون 10 أحرف على الأقل.");
  $id("submit").disabled = true; say("");
  try { done((await call(mode, { email, password, name: $id("name").value.trim() })).user); }
  catch (err) { say(err.message); }
  $id("submit").disabled = false;
});
$id("logout").onclick = async () => { try { await call("logout", {}); } catch {} location.reload(); };

// ----- جوجل -----
window.addEventListener("load", () => {
  if (placeholder(GOOGLE_CLIENT_ID)) {
    $id("gBtn").style.display = "block";
    $id("gBtn").innerHTML = '<button class="sbtn" type="button">المتابعة مع جوجل</button>';
    $id("gBtn").firstChild.onclick = () => say("لسا ما ضبطت GOOGLE_CLIENT_ID داخل login.html.");
    return;
  }
  const start = () => {
    if (!window.google) return say("تعذّر تحميل زر جوجل. تأكد من الإنترنت وأن الموقع مسجّل بـ Authorized origins.");
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: async r => { try { done((await call("google", { credential: r.credential })).user); } catch (e) { say(e.message); } }
    });
    google.accounts.id.renderButton($id("gBtn"), { theme: "outline", size: "large", shape: "pill", width: Math.min(400, $id("gBtn").clientWidth || 300), text: "continue_with" });
  };
  window.google ? start() : setTimeout(start, 1200);
});

// ----- ابل -----
$id("appleBtn").onclick = async () => {
  if (placeholder(APPLE_CLIENT_ID)) return say("لسا ما ضبطت APPLE_CLIENT_ID داخل login.html.");
  try {
    AppleID.auth.init({ clientId: APPLE_CLIENT_ID, scope: "name email", redirectURI: APPLE_REDIRECT, usePopup: true });
    const r = await AppleID.auth.signIn();
    const n = r.user && r.user.name ? `${r.user.name.firstName || ""} ${r.user.name.lastName || ""}`.trim() : undefined;
    done((await call("apple", { id_token: r.authorization.id_token, name: n })).user);
  } catch (e) { if (e && e.error !== "popup_closed_by_user") say((e && e.message) || "تعذّر الدخول عن طريق ابل."); }
};

// ----- عند فتح الصفحة: جيب CSRF وشوف إذا مسجّل دخول -----
(async () => {
  if (API.includes("ضع-")) return;
  try { csrf = (await call("csrf")).csrf; done((await call("me")).user); } catch {}
})();
</script>
<script src="lang.js"></script>
</body>
